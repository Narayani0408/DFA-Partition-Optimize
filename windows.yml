name: Build Windows App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build web app (relative paths for file://)
        run: npm run build:android
      - name: Package Windows .exe
        run: |
          npm install --no-save electron@33.2.0 electron-builder@25.1.8
          npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: DFA-Partition-Optimizer-windows
          path: release/DFA-Partition-Optimizer-Windows.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Windows app (latest)
          body: Download DFA-Partition-Optimizer-Windows.exe and double-click. No install needed.
          files: release/DFA-Partition-Optimizer-Windows.exe
          make_latest: false
